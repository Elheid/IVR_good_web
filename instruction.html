<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">

    <link href="css/style.css" rel="stylesheet">
    <link href="css/instruction.css" rel="stylesheet">
    <title>IVR</title>
  </head>
  <body>
    <div class="go-buttons">
      <button class="go-button prev-button">
          <img src="img/arrow-left-white.svg">
      </button>
      <button class="go-button next-button">
          <img class="next-button-img" src="img/arrow-left-white.svg">
      </button>
  </div>
    <header class="main-header">
    </header>
    <main class="instruct-content">
      <section class="instruct">
        <div class="instruction-container">
            <h3 class="instruction-title">
            Ввод запросов с использованием жестового языка
            </h3>   
            <!--<video src="img/long.mp4" autoplay loop muted> </video>-->
            <div class="text-container">
            <pre class="instruction"><span>Для ввода запросов с использованием жестового языка вам нужно:</span>

   <span>1. Перейти дальше, на страницу выбор категорий, нажав кнопку далее <button class="go-button next-button instruct-sample"><img class="next-button-img" src="img/arrow-left-white.svg"></button></span>
   <span>2. Выбрать кнопку со знаком камеры <button id="showPopup" type="button"><span class="button-title">Поиск по РЖЯ</span><img src="img/record.svg" alt="Кнопка поиска жестами"></button></span>
   <span class="play-span">3. Затем нажать кнопку запись видео <button class="start-record"><img src="img/playSimple.svg" width="32px" height="30px"><span class="button-title back-title">Начать запись</span></button></span>
              </pre>
            </div>
            <!--<button class="more" type="button">Читать дальше</button>
            <button class="less" type="button" style="display:none">Скрыть</button>-->
        </div>
      </section>
      <script src="js/main/mainInstruction.js" type="module"></script>
    </main>
    <footer class="instruct-footer">
    </footer>
  </body>
</html>
